// Notificación push propia de la app (vía el Worker de Cloudflare; solo admins pueden enviar)
async function pushNotificar(tipo, title, body, tag, extra) {
  if(window.ES_PRUEBA) return; // en modo prueba nunca se avisa a la gente real
  try {
    if(!auth.currentUser) return;
    const idToken = await auth.currentUser.getIdToken();
    // En tandas: el Worker manda hasta 40 por llamada y dice desde dónde seguir
    let desde = "", vueltas = 0;
    do {
      const r = await fetch(IA_URL+"/notificar",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
        body:JSON.stringify({tipo,title,body,tag,url:"./",...(extra||{}),desde})});
      const d = await r.json().catch(()=>({}));
      desde = d && typeof d.siguiente==="string" ? d.siguiente : "";
    } while(desde && ++vueltas<100);
  } catch(e) { console.log("Push error:", e); }
}
// Suscribir / desuscribir este celular a las notificaciones push
const b64uABytes = s => { s=s.replace(/-/g,"+").replace(/_/g,"/"); s+="=".repeat((4-s.length%4)%4); const r=atob(s); return Uint8Array.from(r,c=>c.charCodeAt(0)); };
const pushSoportado = () => !window.ES_PRUEBA && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
async function pushSuscribir(tipos, perfil) {
  if(!pushSoportado()) throw new Error("NOSOP");
  const perm = await Notification.requestPermission();
  if(perm!=="granted") throw new Error("PERM");
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    const r = await fetch(IA_URL+"/vapid"); const {publicKey} = await r.json();
    sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uABytes(publicKey)});
  }
  const r2 = await fetch(IA_URL+"/suscribir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON(),tipos,perfil})});
  if(!r2.ok) throw new Error("SERV");
  try{ localStorage.setItem("pushPerfil2",JSON.stringify(perfil||{})); }catch(e){}
  return true;
}
// Actualiza el perfil (bank, inicio, no metidas) de la suscripción existente, sin pedir permisos
async function pushActualizar(tipos, perfil) {
  try{
    if(!pushSoportado() || Notification.permission!=="granted") return;
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if(!sub) return;
    const r = await fetch(IA_URL+"/suscribir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON(),tipos,perfil})});
    if(r.ok) localStorage.setItem("pushPerfil2",JSON.stringify(perfil||{}));
  }catch(e){}
}
async function pushDesuscribir() {
  try{
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    if(sub){ await fetch(IA_URL+"/desuscribir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{}); await sub.unsubscribe(); }
  }catch(e){}
}

  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const max=1600, k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);

let MOMIO_DEC = false;
const fmtMomio = m => { const n=Number(m); if(!n) return ""; if(MOMIO_DEC) return momioToDec(n).toFixed(2); return n>0?`+${n}`:`${n}`; };
// Decimal (1.91) → americano (-110)
const decToAm = d => { const n=Number(String(d).replace(",",".")); if(!(n>1)) return 0; return n>=2?Math.round((n-1)*100):-Math.round(100/(n-1)); };
const momioToDec = m => { const n=Number(m); if(!n) return 0; return n>0?(n/100)+1:(100/Math.abs(n))+1; };
// Promedio de momios americanos: se promedia en decimal y se regresa a americano (promediar +150 y -160 directo no tiene sentido)
const promedioMomio = lista => {
  const dec = lista.reduce((s,a)=>s+momioToDec(a.cuota),0)/lista.length;
  if(dec>=2) return Math.round((dec-1)*100);
  return -Math.round(100/(dec-1));
};
const parseFecha = f => { const [y,m,d]=f.split("-").map(Number); return {y,m:m-1,d}; };

const apMonto = (a, bank) => (Number(a.monto)||0) / 100 * ((typeof bank==="function"?bank(a):bank)||0);
const calcStats = (lista, bank) => {
  const gan = lista.filter(a=>a.resultado==="Ganada");
  const per = lista.filter(a=>a.resultado==="Perdida");
  const pen = lista.filter(a=>a.resultado==="Pendiente");
  const nul = lista.filter(a=>a.resultado==="Nula");
  const invertido = lista.reduce((s,a)=>s+apMonto(a,bank),0);
  const ganancia = gan.reduce((s,a)=>{ const m=apMonto(a,bank); return s+(m*momioToDec(a.cuota)-m); },0);
  const perdido = per.reduce((s,a)=>s+apMonto(a,bank),0);
  const neto = ganancia-perdido;
  const tot = gan.length+per.length;
  return {ganadas:gan.length,perdidas:per.length,pendientes:pen.length,nulas:nul.length,invertido,ganancia,perdido,neto,pct:sumPct(lista),efectividad:tot>0?Math.round(gan.length/tot*100):0,total:lista.length};
};

const marcar = (t, q) => {
  t = String(t||""); if(!q) return t;
  const nt = t.split("").map(c=>{ const n=normTxt(c); return n.length===1?n:c.toLowerCase(); }).join(""), nq = normTxt(q); const out = []; let i = 0, j;
  if(nt.length!==t.length) return t;
  while((j = nt.indexOf(nq, i)) !== -1 && nq){ if(j>i) out.push(t.slice(i,j)); out.push(html`<span style=${{background:"color-mix(in srgb,var(--ac) 35%,transparent)",borderRadius:4,padding:"0 2px",color:"#fff"}}>${t.slice(j,j+nq.length)}</span>`); i = j+nq.length; }
  out.push(t.slice(i)); return out;
};
// Separa "pick" y "partido" de una descripción: usa el campo partido si existe; si no, lo intenta deducir
const separarPick = a => {
  const d = String(a.descripcion||"").trim();
  if(a.partido) return {pick:d, partido:a.partido};
  let m = d.match(/^(.+?)\s*\(([^()]*?\s(?:vs\.?|@|v\.?)\s[^()]*?)\)\s*$/i);
  if(m) return {pick:m[1].trim(), partido:m[2].trim()};
  m = d.match(/^(.+?\s(?:vs\.?|@)\s.+?)\s+[-–—:]\s+(.+)$/i);
  if(m) return {pick:m[2].trim(), partido:m[1].trim()};
  return {pick:d, partido:""};
};

// Despliega/oculta su contenido animando el alto (para el detalle de cada pick)
function Desplegable({abierto, contenido}) {
  const [montado,setMontado] = useState(abierto);
  const ref = useRef(null), animarAbrir = useRef(false), primera = useRef(true);
  useEffect(()=>{
    if(primera.current){ primera.current=false; return; }
    if(abierto){ animarAbrir.current=true; setMontado(true); return; }
    const el=ref.current; if(!el){ setMontado(false); return; }
    el.style.transition="none"; el.style.overflow="hidden"; el.style.height=el.scrollHeight+"px"; el.getBoundingClientRect();
    el.style.transition="height .26s cubic-bezier(.2,.8,.2,1), opacity .2s ease"; el.style.height="0px"; el.style.opacity="0";
    const t=setTimeout(()=>setMontado(false),260); return ()=>clearTimeout(t);
  },[abierto]);
  React.useLayoutEffect(()=>{
    if(!montado || !animarAbrir.current) return; animarAbrir.current=false;
    const el=ref.current; if(!el) return; const h=el.scrollHeight;
    el.style.transition="none"; el.style.overflow="hidden"; el.style.height="0px"; el.style.opacity="0"; el.getBoundingClientRect();
    el.style.transition="height .3s cubic-bezier(.2,.8,.2,1), opacity .22s ease"; el.style.height=h+"px"; el.style.opacity="1";
    const t=setTimeout(()=>{ el.style.height=""; el.style.overflow=""; el.style.transition=""; },310); return ()=>clearTimeout(t);
  },[montado]);
  if(!montado) return null;
  return html`<div ref=${ref}>${contenido()}</div>`;
}

  const netos = {}, pcts = {};
  vistas.forEach(a=>{ const {y,m,d}=parseFecha(a.fecha); if(y===ano&&m===mes&&a.resultado!=="Pendiente"){ netos[d]=(netos[d]||0)+gan(a); pcts[d]=(pcts[d]||0)+gPct(a); } });

  const totalG = apuestas.filter(a=>a.resultado==="Ganada").length;

  const hoy = new Date();
  const apsSel = sel ? delMes(vistas,sel) : [];
  const netoSel = sel ? (OCULTAR ? sumPct(delMes(apuestas,sel)) : delMes(apuestas,sel).reduce((s,a)=>s+gan(a),0)) : 0;

          return html`<button key=${i} onClick=${()=>{ onIr&&onIr(i,selector); setSelector(null); }} style=${{background:on?"var(--ac)":"var(--card)",border:"1px solid "+(on?"var(--ac)":esHoy?"var(--ac)":"var(--br)"),borderRadius:14,padding:"12px 6px",cursor:"pointer",fontFamily:"inherit",minHeight:64}}>
            <div style=${{fontSize:15,fontWeight:800,color:on?"var(--onac)":"#fff"}}>${MESES_CORTO[i]}</div>
            <div style=${{fontSize:12,fontWeight:700,marginTop:4,color:on?"var(--onac)":r===null?"var(--mu3)":r>0?"#2fe0a0":r<0?"#ff5d7a":"var(--mu)"}}>${r===null?"—":OCULTAR?fmtPct(r):fmtK(r)}</div>
          </button>`; })}
      </div>
      <button onClick=${()=>{ onHoy&&onHoy(); setSelector(null); }} style=${{...S.btnSecondary,width:"100%",marginTop:14,minHeight:46}}>Ir a hoy</button>
    </${Hoja}>`}
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"6px 0 14px"}}>
      <h1 style=${S.pageTitle}>Calendario</h1>

    <div style=${S.monthRow}>

        const dia=i+1;
        const lista=delMes(vistas,dia);
        const tiene=lista.length>0;
        const cuenta=delMes(apuestas,dia).length>0;
        const neto=netos[dia];
        const esHoy=hoy.getDate()===dia&&hoy.getMonth()===mes&&hoy.getFullYear()===ano;

    <div style=${{display:"flex",gap:8,marginTop:14}}>
      ${[[OCULTAR?fmtPct(profitPct):(profit>=0?"+":"")+fmt(profit),"Del mes",(OCULTAR?profitPct:profit)>=0?"#2fe0a0":"#ff5d7a"],[totalG+" ✓","Ganados","#2fe0a0"],[totalP+" ✕","Perdidos","#ff5d7a"]].map(([v,l,c])=>html`

// ── Imagen para compartir el resumen del mes ──
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function dibujarResumen(o){
  const hist = o.formato==="historia";
  const W=1080, H=hist?1920:1080, P=80;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const F=(w,s)=>`${w} ${s}px 'DM Sans','Helvetica Neue',Arial,sans-serif`;
  const G="#2fe0a0", R="#ff5d7a", T=o.t||{g1:"#1d4fd8",g2:"#0f2160",bg:"#0a0f20",ac2:"#9ec1ff"};
  let g;
  if(hist){ g=x.createRadialGradient(200,0,0,200,0,2000); g.addColorStop(0,T.g1); g.addColorStop(.45,T.g2); g.addColorStop(1,T.bg); }
  else { g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,T.g1); g.addColorStop(1,T.bg); }
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.textBaseline="alphabetic"; x.textAlign="left";
  // Encabezado
  x.font=F(800,60); x.fillStyle="#fff"; x.fillText("ALEX",P,P+60);
  x.fillStyle=T.ac2; x.fillText("PICKS",P+x.measureText("ALEX").width,P+60);
  x.font=F(600,34); const mw=x.measureText(o.mes).width+56;
  x.fillStyle="rgba(255,255,255,.14)"; rr(x,W-P-mw,P+8,mw,64,32); x.fill();
  x.fillStyle="#fff"; x.textAlign="center"; x.fillText(o.mes,W-P-mw/2,P+52); x.textAlign="left";
  // Resultado
  let y = hist?(o.mejor?560:640):300;
  x.font=F(600,36); x.fillStyle="rgba(255,255,255,.8)"; x.fillText("RESULTADO DEL MES",P,y);
  const pos = o.neto>=0;
  let grande, chico="";
  if(o.pct!==null){ grande=(o.pct>=0?"+":"-")+Math.abs(o.pct).toFixed(1)+"%"; if(o.pesos) chico=(pos?"+":"-")+fmtReal(Math.abs(o.neto)).replace("-","")+" MXN"; }
  else if(o.pesos){ grande=(pos?"+":"-")+fmtReal(Math.abs(o.neto)).replace("-",""); }
  else { grande=o.record; }
  const tg = hist?190:160;
  x.font=F(900,tg);
  while(x.measureText(grande).width>W-2*P && tg>60){ x.font=F(900,tg-=10); }
  y += tg*0.95; x.fillStyle=o.pct===null&&!o.pesos?"#fff":(pos?G:R); x.fillText(grande,P-6,y);
  if(chico){ y+=78; x.font=F(700,58); x.fillStyle="rgba(255,255,255,.92)"; x.fillText(chico,P,y); }
  // Tres datos
  y += hist?80:60;
  const bh = hist?170:150, gap=24, bw=(W-2*P-2*gap)/3;
  [[o.record,"Récord"],[o.acierto+"%","Acierto"],[o.racha,o.rachaLbl||"Racha"]].forEach(([v,l],i)=>{
    const bx=P+i*(bw+gap);
    x.fillStyle="rgba(255,255,255,.1)"; rr(x,bx,y,bw,bh,34); x.fill();
    x.textAlign="center"; x.fillStyle="#fff"; x.font=F(800,hist?62:56); x.fillText(v,bx+bw/2,y+bh*0.52);
    x.font=F(500,30); x.fillStyle="rgba(255,255,255,.75)"; x.fillText(l,bx+bw/2,y+bh*0.82); x.textAlign="left";
  });
  y += bh;
  if(hist){
    // Últimos picks
    if(o.forma.length){
      y += 100; x.font=F(600,32); x.fillStyle="rgba(255,255,255,.75)"; x.fillText("ÚLTIMOS PICKS",P,y);
      y += 30; const d=78, sp=(W-2*P-10*d)/9;
      o.forma.forEach((r,i)=>{ const cx=P+i*(d+sp)+d/2, cy=y+d/2;
        x.beginPath(); x.arc(cx,cy,d/2,0,Math.PI*2); x.fillStyle=r==="Ganada"?G:R; x.fill();
        x.fillStyle="#06101f"; x.font=F(900,40); x.textAlign="center"; x.fillText(r==="Ganada"?"✓":"✕",cx,cy+14); x.textAlign="left"; });
      y += d;
    }
    // Mejor pick
    if(o.mejor){
      y += 70; const h=190;
      x.fillStyle="rgba(255,255,255,.09)"; rr(x,P,y,W-2*P,h,40); x.fill();
      x.font=F(600,30); x.fillStyle="rgba(255,255,255,.75)"; x.fillText("★ MEJOR PICK",P+40,y+62);
      x.font=F(800,46); x.fillStyle=G; x.textAlign="right"; x.fillText(o.mejor.valor,W-P-40,y+140);
      const maxW=W-2*P-80-x.measureText(o.mejor.valor).width-30; x.textAlign="left";
      x.font=F(700,46); x.fillStyle="#fff"; let t=o.mejor.texto;
      if(x.measureText(t).width>maxW){ while(t.length>1&&x.measureText(t+"…").width>maxW) t=t.slice(0,-1); t+="…"; }
      x.fillText(t,P+40,y+140);
    }
  }
  // Pie
  x.font=F(500,34); x.fillStyle="rgba(255,255,255,.7)";
  if(hist){ x.textAlign="center"; x.fillText("Sigue mis picks · AlexPicks",W/2,H-80); }
  else x.fillText("Sigue mis picks · AlexPicks",P,H-64);
  return c;
}

// ── Imagen para compartir UN pick (historia 1080×1920 o cuadrada 1080×1350) ──
const cargarImg = (src, cors) => new Promise(ok=>{ if(!src) return ok(null); const i=new Image(); if(cors) i.crossOrigin="anonymous";
  const t=setTimeout(()=>ok(null),2500); i.onload=()=>{ clearTimeout(t); ok(i); }; i.onerror=()=>{ clearTimeout(t); ok(null); }; i.src=src; });
const icoImg = (k, color) => cargarImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONOS[k]||""}</svg>`));
async function dibujarPick(o){
  const hist = o.formato==="historia";
  const W=1080, H=hist?1920:1350, P=90;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const F=(w,s)=>`${w} ${s}px 'DM Sans','Helvetica Neue',Arial,sans-serif`;
  const G="#2fe0a0", R="#ff5d7a", MU="#8b8f99";
  const [logo, ico, lh, la] = await Promise.all([cargarImg("icon2-512.png"), icoImg(o.ico,MU), o.eq?cargarImg(o.eq[0].l,true):null, o.eq?cargarImg(o.eq[1].l,true):null]);
  // Fondo
  const g=x.createRadialGradient(W/2,0,0,W/2,0,H*0.9); g.addColorStop(0,"#171b24"); g.addColorStop(.55,"#050506"); g.addColorStop(1,"#000");
  x.fillStyle=g; x.fillRect(0,0,W,H); x.textBaseline="alphabetic";
  // Encabezado: logo, marca y fecha
  if(logo){ x.save(); rr(x,P,P,130,130,32); x.clip(); x.drawImage(logo,P,P,130,130); x.restore(); }
  x.textAlign="left"; x.fillStyle="#fff"; x.font=F(900,56); x.fillText("ALEXPICKS",P+160,P+70);
  x.fillStyle=MU; x.font=F(500,36); x.fillText(o.fechaTxt,P+160,P+118);
  // Contenido centrado
  const bloques=[]; // [alto, dibujar(y)]
  const pill=(txt,bg,fg)=>[80,y=>{ x.font=F(900,32); const w=x.measureText(txt).width+80; x.fillStyle=bg; rr(x,(W-w)/2,y,w,70,35); x.fill(); x.fillStyle=fg; x.textAlign="center"; x.fillText(txt.split("").join(String.fromCharCode(8202)),W/2,y+47); }];
  const tag = o.res==="Ganada"?["GANADO",G,"#000"]:o.res==="Perdida"?["PERDIDO",R,"#000"]:o.res==="Nula"?["NULO","#f5c842","#000"]:[o.hoy?"PICK DEL DÍA":"PICK","#fff","#000"];
  bloques.push(pill(...tag));
  bloques.push([70,y=>{ x.font=F(600,38); const t=o.liga; const w=x.measureText(t).width; const sx=(W-w-62)/2; if(ico) x.drawImage(ico,sx,y+4,46,46); x.fillStyle=MU; x.textAlign="left"; x.fillText(t,sx+62,y+42); }]);
  if(o.eq){
    bloques.push([290,y=>{ const cx=[W/2-230,W/2+230], rad=88;
      o.eq.forEach((e,i)=>{ const img=i?la:lh, X=cx[i], Y=y+rad+10;
        x.beginPath(); x.arc(X,Y,rad,0,Math.PI*2); x.fillStyle=img?"rgba(255,255,255,.06)":(e.c||"#2a2c31"); x.fill();
        x.lineWidth=4; x.strokeStyle="rgba(255,255,255,.14)"; x.stroke();
        if(img){ const s=rad*1.35; x.drawImage(img,X-s/2,Y-s/2,s,s); }
        else { x.fillStyle="#fff"; x.font=F(900,50); x.textAlign="center"; x.fillText(String(e.a||e.n||"?").slice(0,3).toUpperCase(),X,Y+18); }
        x.fillStyle="#c9ccd3"; x.font=F(500,40); x.textAlign="center"; x.fillText(e.n||"",X,Y+rad+62); });
      x.fillStyle="#55585f"; x.font=F(700,56); x.textAlign="center"; x.fillText(o.sep,W/2,y+rad+30); }]);
  } else if(o.partido){
    bloques.push([70,y=>{ x.fillStyle="#c9ccd3"; x.font=F(500,42); x.textAlign="center"; x.fillText(o.partido,W/2,y+46); }]);
  }
  // El pick en grande (hasta 2 líneas, se achica si no cabe)
  const lineas=(t,f,max)=>{ x.font=f; const ps=String(t).split(" "), out=[]; let l=""; ps.forEach(p=>{ const n=l?l+" "+p:p; if(x.measureText(n).width>max&&l){ out.push(l); l=p; } else l=n; }); if(l) out.push(l); return out; };
  let tam=118, ls; do { ls=lineas(o.pick,F(900,tam),W-2*P); if(ls.length<=2) break; tam-=8; } while(tam>60);
  ls=ls.slice(0,3);
  bloques.push([ls.length*tam*1.08+20,y=>{ x.fillStyle="#fff"; x.font=F(900,tam); x.textAlign="center"; ls.forEach((l,i)=>x.fillText(l,W/2,y+tam*(i+0.92)*1.08)); }]);
  if(o.legs && o.legs.length){
    const lg=o.legs.slice(0,6);
    bloques.push([lg.length*62+10,y=>{ x.textAlign="left"; lg.forEach((p,i)=>{ const Y=y+i*62+44; const m=p.res==="G"?"✓":p.res==="P"?"✕":"•";
      x.font=F(800,40); x.fillStyle=p.res==="G"?G:p.res==="P"?R:MU; x.fillText(m,P+20,Y);
      x.font=F(500,40); x.fillStyle="#dfe2e8"; let t=p.desc; while(x.measureText(t).width>W-2*P-90&&t.length>4) t=t.slice(0,-2); if(t!==p.desc) t=t.trim()+"…"; x.fillText(t,P+80,Y); }); }]);
  }
  if(o.final) bloques.push([130,y=>{ x.textAlign="center"; x.fillStyle=MU; x.font=F(500,34); x.fillText(o.finalLbl||"Final",W/2,y+36); x.fillStyle="#fff"; x.font=F(900,76); x.fillText(o.final,W/2,y+116); }]);
  bloques.push([170,y=>{ const cs=o.datos, gap=22, bw=(W-2*P-gap*(cs.length-1))/cs.length;
    cs.forEach(([l,v,col],i)=>{ const X=P+i*(bw+gap); x.fillStyle="#141518"; rr(x,X,y,bw,150,30); x.fill(); x.lineWidth=2; x.strokeStyle="#232529"; x.stroke();
      x.textAlign="center"; x.fillStyle=MU; x.font=F(500,32); x.fillText(l,X+bw/2,y+52);
      x.fillStyle=col||"#fff"; let s=50; x.font=F(800,s); while(x.measureText(v).width>bw-24&&s>28){ x.font=F(800,s-=4); } x.fillText(v,X+bw/2,y+116); }); }]);
  const gapB = hist?44:30, alto=bloques.reduce((t,b)=>t+b[0],0)+gapB*(bloques.length-1);
  // Si no cabe (p. ej. cuadrada con marcador final y nombre largo), todo el contenido se achica parejo
  const top=P+170, bottom=H-P-80, esp=bottom-top, k=Math.min(1, esp/alto);
  x.save(); x.translate(W/2, top+Math.max(0,(esp-alto*k)/2)); x.scale(k,k); x.translate(-W/2, 0);
  let y=0; bloques.forEach(([h,f])=>{ f(y); y+=h+gapB; });

// ── Número que sube contando (de 0 al valor, o del valor anterior al nuevo) ──
function Contador({valor, formato, dur=800, inicial=0}) {
  const [v,setV] = useState(inicial);
  const desde = useRef(inicial);
  useEffect(()=>{
    const fin = Number(valor)||0;
    const reducir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reducir){ setV(fin); desde.current=fin; return; }
    const ini = desde.current, t0 = performance.now();
    let raf;
    const paso = t => {
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      const x = ini+(fin-ini)*e;
      setV(x); desde.current = x;
      if(p<1) raf = requestAnimationFrame(paso);
    };
    raf = requestAnimationFrame(paso);
    return ()=>cancelAnimationFrame(raf);
  },[valor]);
  return formato(v);
}

// ── Hoja que sube desde abajo y se cierra jalándola hacia abajo ──
// ── Botón / gesto "atrás" de Android: cierra lo que está abierto en vez de salirse de la app ──
// Solo en Android (en iPhone no hay botón atrás y todo se queda igual).
const ES_ANDROID = /android/i.test(navigator.userAgent) && !window.ES_PRUEBA_SIN_ATRAS;
const Atras = { pila: [], guard: false, ignorar: 0, vista: "inicio", volverVista: null,
  // Deja una entrada en el historial solo cuando hay algo que cerrar o no estamos en Inicio
  sync(){ if(!ES_ANDROID) return; const hay = Atras.pila.length>0 || Atras.vista!=="inicio";
    if(hay && !Atras.guard){ try{ history.pushState({alexAtras:1},""); Atras.guard=true; }catch(e){} }
    else if(!hay && Atras.guard){ Atras.guard=false; Atras.ignorar++; history.back(); } },
  abrir(fn){ Atras.pila.push(fn); Atras.sync(); return ()=>{ const i=Atras.pila.lastIndexOf(fn); if(i>=0) Atras.pila.splice(i,1); setTimeout(()=>Atras.sync(),0); }; }
};
if(ES_ANDROID) window.addEventListener("popstate", ()=>{
  if(Atras.ignorar>0){ Atras.ignorar--; return; }
  Atras.guard=false;
  const fn = Atras.pila[Atras.pila.length-1];
  if(fn) fn(); else if(Atras.vista!=="inicio" && Atras.volverVista) Atras.volverVista();
  setTimeout(()=>Atras.sync(),0);
});
// Registra algo que "atrás" debe cerrar mientras esté abierto
function useAtras(abierto, cerrar) {
  const ref = useRef(cerrar); ref.current = cerrar;
  useEffect(()=>{ if(!abierto||!ES_ANDROID) return; return Atras.abrir(()=>ref.current&&ref.current()); },[abierto]);
}

function Hoja({onClose, children, maxW=640}) {
  const panel = useRef(null), fondo = useRef(null), drag = useRef(null), cerrando = useRef(false);
  // Mientras la hoja está abierta, lo de atrás no se mueve
  useEffect(()=>{
    // Se bloquea el scroll sin mover el body (moverlo hacía brincar la barra de abajo en iPhone)
    const b = document.body.style, hs = document.documentElement.style, prev = {bo:b.overflow, ho:hs.overflow};
    Hoja.abiertas = (Hoja.abiertas||0)+1; b.overflow="hidden"; hs.overflow="hidden";
    const p = panel.current, f = fondo.current;
    // Listeners no pasivos para poder frenar el scroll nativo mientras se jala la hoja
    let x0=0, y0=0;
    const inicioToque = e => { const t=e.touches[0]; x0=t.clientX; y0=t.clientY; };
    const enPanel = e => {
      // Movimiento de lado (p. ej. deslizar los chips de deportes): se deja pasar
      const t0=e.touches[0];
      if(Math.abs(t0.clientX-x0)>Math.abs(t0.clientY-y0) && !(drag.current&&drag.current.activo)) return;
      // Si el contenido de la hoja no tiene scroll, ningún movimiento vertical debe llegar a la página de atrás
      if(p.scrollHeight<=p.clientHeight+1 && e.cancelable) e.preventDefault();
      const d = drag.current; if(!d) return;
      const dy = e.touches[0].clientY - d.y;
      // Jalando hacia abajo con el contenido hasta arriba: es la hoja la que se mueve, no la página
      if(d.activo || (dy>0 && p.scrollTop<=0)) { if(e.cancelable) e.preventDefault(); }
    };
    const enFondo = e => e.preventDefault();
    p && p.addEventListener("touchstart", inicioToque, {passive:true});
    p && p.addEventListener("touchmove", enPanel, {passive:false});
    f && f.addEventListener("touchmove", enFondo, {passive:false});
    return ()=>{
      p && p.removeEventListener("touchstart", inicioToque); p && p.removeEventListener("touchmove", enPanel); f && f.removeEventListener("touchmove", enFondo);
      Hoja.abiertas = Math.max(0,(Hoja.abiertas||1)-1); if(!Hoja.abiertas){ b.overflow=prev.bo; hs.overflow=prev.ho; }
    };
  },[]);
  const cerrar = () => {
    if(cerrando.current) return; cerrando.current = true;
    const p=panel.current, f=fondo.current;
    if(p){ p.style.animation="none"; p.style.transition="transform .22s ease-in"; p.style.transform="translateY(105%)"; }
    if(f){ f.style.animation="none"; f.style.transition="opacity .22s"; f.style.opacity="0"; }
    setTimeout(onClose,210);
  };
  useAtras(true, cerrar);
  const ini = e => {
    const p=panel.current; if(!p || e.touches.length!==1) return;
    const enManija = !!e.target.closest("[data-manija]");
    if(!enManija && p.scrollTop>2) return; // si el contenido está scrolleado, primero se scrollea
    drag.current = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now(), dy:0, activo:false};
  };
  const mov = e => {
    const d=drag.current; if(!d) return;
    const dy = e.touches[0].clientY-d.y;
    if(!d.activo){ if(dy<-4 || Math.abs(e.touches[0].clientX-d.x)>Math.abs(dy)){ drag.current=null; return; } if(dy<8) return; d.activo=true; d.t=Date.now(); }
    d.dy = Math.max(0,dy-8);
    const p=panel.current, f=fondo.current;
    p.style.animation="none"; p.style.transition="none"; p.style.transform=`translateY(${d.dy}px)`;
    if(f){ f.style.animation="none"; f.style.transition="none"; f.style.opacity=String(Math.max(.15,1-d.dy/450)); }
  };
  const fin = () => {
    const d=drag.current; drag.current=null;
    if(!d || !d.activo) return;
    const p=panel.current, f=fondo.current;
    const vel = d.dy/Math.max(1,Date.now()-d.t);
    if(d.dy > p.offsetHeight*0.28 || (vel>0.5 && d.dy>40)) { cerrar(); return; }
    p.style.transition="transform .3s cubic-bezier(.2,1.25,.4,1)"; p.style.transform="";
    if(f){ f.style.transition="opacity .25s"; f.style.opacity=""; }
  };
  // Se pinta directo en <body> para que nada de la pantalla de atrás la desacomode
  return ReactDOM.createPortal(html`<div data-noswipe style=${{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div ref=${fondo} className="hoja-fondo" onClick=${cerrar} style=${{position:"absolute",inset:0,background:"rgba(0,0,0,.62)"}}></div>
    <div ref=${panel} className="hoja-panel" onTouchStart=${ini} onTouchMove=${mov} onTouchEnd=${fin} onTouchCancel=${fin}
      style=${{position:"relative",background:"var(--card2)",borderTop:"1px solid var(--br2)",borderRadius:"26px 26px 0 0",width:"100%",maxWidth:maxW,maxHeight:"88vh",overflowY:"auto",overscrollBehavior:"contain",padding:"0 18px calc(22px + env(safe-area-inset-bottom))",boxShadow:"0 -10px 30px #0008",color:"#e8e8f0"}}>
      <div data-manija style=${{position:"sticky",top:0,zIndex:2,background:"var(--card2)",padding:"10px 0 12px",margin:"0 -18px 4px",touchAction:"none",cursor:"grab"}}>
        <div style=${{width:44,height:5,borderRadius:3,background:"var(--mu3)",margin:"0 auto"}}></div>
      </div>
      ${children}
    </div>
  </div>`, document.body);
}

            ${ia.estado==="leyendo" ? html`<span className="sk" style=${{width:18,height:18,borderRadius:"50%"}}></span> Leyendo boleto…` : html`<${Ico} k="cam" c="#fff" s=${20}/> Leer boleto con IA`}
          </label>
          ${ia.estado==="listo" && html`<div style=${{marginTop:8,fontSize:13,lineHeight:1.4,color:"#dfe5ff",background:"color-mix(in srgb,#2fe0a0 12%,transparent)",border:"1px solid color-mix(in srgb,#2fe0a0 40%,transparent)",borderRadius:12,padding:"10px 12px"}}>
            ✓ Listo. <b>Revisa los datos antes de guardar.</b>${ia.msg?html`<br/>${ia.msg}`:""}</div>`}
          ${ia.estado==="error" && html`<div style=${{marginTop:8,fontSize:13,color:"#ff5d7a",background:"#ff5d7a15",border:"1px solid #ff5d7a40",borderRadius:12,padding:"10px 12px"}}>${ia.msg}</div>`}
          ${!ia.estado && html`<div style=${{marginTop:6,fontSize:12,color:"var(--mu)",textAlign:"center"}}>Sube la captura de tu boleto y se llena solo</div>`}
        </div>`}
        <div style=${S.formGrid}>
          ${(form.tipo!=="Parlay/Combinada"&&form.tipo!=="Freebet") && html`<div style=${S.fg}>
            <label style=${S.label}>Deporte</label>
            <select style=${S.select} value=${form.deporte} onChange=${e=>setForm(f=>({...f,deporte:e.target.value}))}>
              <option value="">Seleccionar...</option>
              ${DEPORTES.map(d=>html`<option key=${d} value=${d}>${d}</option>`)}
            </select>
          </div>`}
          <div style=${S.fg}>
            <label style=${S.label}>Tipo</label>
            <select style=${S.select} value=${form.tipo} onChange=${e=>setForm(f=>({...f,tipo:e.target.value}))}>
              <option value="">Seleccionar...</option>
              ${TIPOS.map(t=>html`<option key=${t} value=${t}>${t}</option>`)}
            </select>
          </div>
          ${(form.tipo!=="Parlay/Combinada"&&form.tipo!=="Freebet")
            ? html`<div style=${{...S.fg,gridColumn:"1/-1"}}>
                <label style=${S.label}>Pick</label>
                <input style=${S.input} value=${form.descripcion} onInput=${e=>setForm(f=>({...f,descripcion:e.target.value}))} placeholder=${form.tipo==="Especial por jugador"?"Ej: LeBron James +25.5 puntos":form.tipo==="PlayBoost"?"Ej: Boost Chiefs gana +180":"Ej: Real Madrid vs Barcelona"}/>
                <label style=${{...S.label,marginTop:8}}>Partido <span style=${{textTransform:"none",letterSpacing:0,fontWeight:400}}>(opcional)</span></label>
                ${campoPartido(form.evento, ()=>setElegir({dia:0,dep:"",q:""}), ()=>setForm(f=>({...f,evento:null,partido:""})))}
                ${!(form.evento&&form.evento.id) && html`
                    <input style=${{...S.input,marginTop:8}} value=${form.partido||""} onInput=${e=>setForm(f=>({...f,partido:e.target.value}))} placeholder="o escríbelo a mano: Galatasaray vs Barcelona"/>`}
              </div>`
            : html`<div style=${{gridColumn:"1/-1"}}>
                <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <label style=${S.label}>${form.tipo==="Freebet"?"Legs de la Freebet":"Legs del Parlay"} (${form.patas.length})</label>
                  <button onClick=${()=>setForm(f=>({...f,patas:[...f.patas,{deporte:"",desc:""}]}))} style=${S.addPataBtn}>+ Agregar</button>
                </div>
                <div style=${{display:"flex",flexDirection:"column",gap:10}}>
                  ${form.patas.map((p,i)=>html`
                    <div key=${i} style=${{background:"var(--bg)",border:"1px solid var(--br)",borderRadius:10,padding:"10px 12px"}}>
                      <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                        <span style=${{fontSize:12,color:"#2fe0a0",fontWeight:700}}>Leg ${i+1}</span>
                        <button onClick=${()=>setForm(f=>({...f,patas:f.patas.filter((_,j)=>j!==i)}))} style=${S.removePataBtn}>✕ Eliminar</button>
                      </div>
                      <div style=${{display:"flex",gap:8,flexDirection:"column"}}>
                        <select style=${S.select} value=${p.deporte} onChange=${e=>setForm(f=>{const np=[...f.patas];np[i]={...np[i],deporte:e.target.value};return{...f,patas:np};})}>
                          <option value="">Deporte (opcional)</option>
                          ${DEPORTES.map(d=>html`<option key=${d} value=${d}>${d}</option>`)}
                        </select>
                        <input style=${S.input} value=${p.desc} onInput=${e=>setForm(f=>{const np=[...f.patas];np[i]={...np[i],desc:e.target.value};return{...f,patas:np};})} placeholder=${"Descripción: Ej: Lakers -5.5"}/>
                        ${campoPartido(p.evento, ()=>setElegir({dia:0,dep:"",q:"",pata:i}), ()=>setForm(f=>{const np=[...f.patas];np[i]={...np[i],evento:null};return{...f,patas:np};}), true)}
                      </div>
                    </div>
                  `)}
                </div>
              </div>`
          }
          <div style=${S.fg}>
            <label style=${S.label}>Porcentaje del bank (%)</label>
            <input style=${S.input} type="number" value=${form.monto} onInput=${e=>setForm(f=>({...f,monto:e.target.value}))} placeholder="2" min="0" step="0.5"/>
            ${bankrollMes>0 && html`<div style=${{fontSize:11,color:"#2fe0a0",marginTop:4}}>= ${fmt((Number(form.monto)||0)/100*bankrollMes)} MXN</div>`}
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Momio (${momioDec?"decimal":"americano"})</label>
            ${momioDec
              ? html`<input style=${S.input} type="text" inputMode="decimal" value=${form.cuota} onInput=${e=>setForm(f=>({...f,cuota:e.target.value}))} placeholder="1.91 o 2.50"/>`
              : html`<div style=${{display:"flex",gap:8}}>
              <button type="button" onClick=${()=>setForm(f=>{const d=String(f.cuota).replace(/[^0-9]/g,"");const neg=String(f.cuota).trim().startsWith("-");return{...f,cuota:(neg?"+":"-")+d};})}
                style=${{...S.btnSecondary,padding:"0 16px",fontSize:20,fontWeight:800,flexShrink:0,color:String(form.cuota).trim().startsWith("-")?"#ff5d7a":"#2fe0a0"}}>${String(form.cuota).trim().startsWith("-")?"−":"+"}</button>
              <input style=${{...S.input,flex:1,minWidth:0}} type="text" inputMode="numeric" value=${form.cuota} onInput=${e=>setForm(f=>({...f,cuota:e.target.value}))} onBlur=${e=>{const v=e.target.value.trim();if(v&&!v.startsWith("-")&&!v.startsWith("+"))setForm(f=>({...f,cuota:"+"+v}));}} placeholder="-110 o +150"/>
            </div>`}
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Fecha</label>
            <input style=${S.input} type="date" value=${form.fecha} onChange=${e=>setForm(f=>({...f,fecha:e.target.value}))}/>
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Resultado</label>
            <select style=${S.select} value=${form.resultado} onChange=${e=>setForm(f=>({...f,resultado:e.target.value}))}>
              ${RESULTADOS.map(r=>html`<option key=${r} value=${r}>${r}</option>`)}
            </select>
          </div>
        </div>
        ${form.monto&&form.cuota&&momioToDec(cuotaAm(form.cuota))>0 && html`<div style=${S.preview}>
          Momio: <span style=${{color:"#fff",fontWeight:700}}>${fmtMomio(cuotaAm(form.cuota))}</span>
          ${bankrollMes>0 && (()=>{ const st=(Number(form.monto)||0)/100*bankrollMes; return html`<span><span style=${{marginLeft:12}}>· Ganancia potencial: </span>
          <span style=${{color:"#2fe0a0",fontWeight:700}}>${fmt(st*momioToDec(cuotaAm(form.cuota))-st)}</span>
          <span style=${{color:"var(--mu)",marginLeft:12}}>Retorno: ${fmt(st*momioToDec(cuotaAm(form.cuota)))}</span></span>`; })()}
        </div>`}
        ${formError && html`<div style=${{color:"#ff5d7a",fontSize:13,marginBottom:12,padding:"8px 12px",background:"#ff5d7a15",borderRadius:8,border:"1px solid #ff5d7a30"}}>${formError}</div>`}
        <div style=${S.modalFooter}>
          <button onClick=${()=>setModal(false)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${guardar} style=${S.btnPrimary}>Guardar</button>
        </div>`}
    </${Hoja}>`}

    <!-- Modal bank del usuario -->
    ${bankModal && html`<${Hoja} onClose=${()=>setBankModal(false)} maxW=${480}>
        <div style=${S.modalHeader}>
          <h2 style=${S.modalTitle}>${isAdmin?"Bank":"Tu bank"} de ${MESES[mesSeleccionado].toLowerCase()}</h2>
          <button onClick=${()=>setBankModal(false)} style=${S.closeBtn}>✕</button>
        </div>
        <p style=${{color:"var(--mu)",fontSize:13,marginBottom:14,lineHeight:1.4}}>${isAdmin?"Con cuánto empiezas el mes. Lo ven todos los que no han iniciado sesión.":"Escribe cuánto tienes y desde qué día cuentas los picks."}</p>
        <input style=${{...S.input,marginBottom:14}} type="number" inputMode="numeric" placeholder="Bank en MXN" value=${bmInput} onInput=${e=>setBmInput(e.target.value)}/>
        ${!isAdmin && [["dia1","Desde el día 1 del mes"],...(esMesActual?[["hoy","Desde hoy ("+fmtDia(hoyISO)+")"]]:[]),["otro","Elegir otro día"]].map(([v,l])=>html`
          <div key=${v} onClick=${()=>setBmModo(v)} style=${{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:10,marginBottom:8,cursor:"pointer",fontSize:14,border:"1px solid "+(bmModo===v?"var(--ac)":"var(--br2)"),background:bmModo===v?"color-mix(in srgb,var(--ac) 10%,transparent)":"transparent"}}>
            <span style=${{width:14,height:14,borderRadius:"50%",border:"2px solid "+(bmModo===v?"var(--ac)":"#556"),background:bmModo===v?"var(--ac)":"transparent",flexShrink:0}}></span>${l}
          </div>`)}
        ${bmModo==="otro" && html`<input style=${{...S.input,marginBottom:8}} type="date" min=${mesPrefijo+"-01"} max=${mesPrefijo+"-"+String(new Date(anoSeleccionado,mesSeleccionado+1,0).getDate()).padStart(2,"0")} value=${bmFecha} onChange=${e=>setBmFecha(e.target.value)}/>`}
        ${bmError && html`<div style=${{color:"#ff5d7a",fontSize:13,margin:"4px 0 8px"}}>${bmError}</div>`}
        <div style=${{...S.modalFooter,marginTop:12}}>
          <button onClick=${()=>setBankModal(false)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${guardarBankModal} style=${S.btnPrimary}>Guardar bank</button>
        </div>
    </${Hoja}>`}

    <!-- Modal eliminar -->
    ${pickCompartir && html`<${CompartirPick} a=${pickCompartir} onClose=${()=>setPickCompartir(null)}/>`}
    ${deleteConfirm && html`<${Hoja} onClose=${()=>setDeleteConfirm(null)} maxW=${480}>
        <div style=${S.modalHeader}>
          <h2 style=${{...S.modalTitle,color:"#ff5d7a"}}>Eliminar apuesta</h2>
          <button onClick=${()=>setDeleteConfirm(null)} style=${S.closeBtn}>✕</button>
        </div>
        <p style=${{color:"#aaa",marginBottom:24}}>¿Estás seguro? Esta acción no se puede deshacer.</p>
        <div style=${S.modalFooter}>
          <button onClick=${()=>setDeleteConfirm(null)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${()=>eliminar(deleteConfirm)} style=${{...S.btnPrimary,background:"#ff5d7a"}}>Eliminar</button>
        </div>
    </${Hoja}>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
