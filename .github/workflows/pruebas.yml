# El robot. Cada cambio en la rama "prueba":
#  1) se copia a la app de prueba (/prueba/ dentro de main) para verla en el celular,
#  2) el robot la prueba como iPhone y como Android (con datos falsos),
#  3) si todo pasa, se pasa a la app real — salvo que el mensaje del cambio diga [revisar].
name: Robot de pruebas

on:
  push:
    branches: [prueba]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  actualizar-app-de-prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: prueba, path: rama-prueba }
      - name: Copiar a /prueba/
        run: |
          rm -rf main/prueba && mkdir -p main/prueba
          rsync -a --exclude .git --exclude .github --exclude tests --exclude node_modules \
            --exclude package.json --exclude playwright.config.js --exclude firebase --exclude ia-worker \
            rama-prueba/ main/prueba/
          cd main
          git config user.name "robot-alexpicks"; git config user.email "robot@users.noreply.github.com"
          git add -A prueba
          git diff --cached --quiet || (git commit -m "App de prueba actualizada" && git push origin HEAD:main)
      - name: Publicar
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}

  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: mkdir -p capturas && npx playwright test --reporter=list,json
        env: { PLAYWRIGHT_JSON_OUTPUT_NAME: capturas/resultados.json }
      - name: Guardar capturas y reporte
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: reporte-robot, path: playwright-report, retention-days: 14 }
      - name: Subir capturas a la rama "capturas" (para revisarlas)
        if: always()
        run: |
          [ -d capturas ] || exit 0
          cd capturas && git init -q && git checkout -q -b capturas
          git -c user.name=robot -c user.email=robot@users.noreply.github.com add -A
          git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -qm "Capturas $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

  pasar-a-la-app-real:
    needs: [actualizar-app-de-prueba, probar]
    if: ${{ !contains(github.event.head_commit.message, '[revisar]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Juntar prueba → main
        run: |
          git config user.name "robot-alexpicks"; git config user.email "robot@users.noreply.github.com"
          git fetch origin prueba
          git merge --no-edit -X theirs origin/prueba -m "Pasa a la app real (aprobado por el robot)"
          git push origin HEAD:main
      - name: Publicar
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
