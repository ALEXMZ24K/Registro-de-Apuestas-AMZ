name: Prueba jugadores
on: { push: { branches: [diag] } }
permissions: { contents: write }
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: prueba, path: app }
      - uses: actions/checkout@v4
        with: { path: diag }
      - run: |
          npx -y esbuild@0.24.0 app/ia-worker/worker.js --bundle --format=esm --outfile=w.mjs --log-level=warning
          sed -i 's/^export {/export { marcadores as __m, /' w.mjs
          cp diag/prueba.mjs . && node prueba.mjs > res.txt 2>&1; cat res.txt
          mkdir out && cp res.txt out/ && cd out && git init -q && git checkout -q -b diag-resultados && git -c user.name=r -c user.email=r@x add -A && git -c user.name=r -c user.email=r@x commit -qm m && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-resultados
