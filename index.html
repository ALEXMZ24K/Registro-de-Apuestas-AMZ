const fmt = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(n);
// Formato de momio elegido por el usuario (americano o decimal); se actualiza en cada render de App
let MOMIO_DEC = false;
const fmtMomio = m => { const n=Number(m); if(!n) return ""; if(MOMIO_DEC) return momioToDec(n).toFixed(2); return n>0?`+${n}`:`${n}`; };
// Decimal (1.91) → americano (-110)
const decToAm = d => { const n=Number(String(d).replace(",",".")); if(!(n>1)) return 0; return n>=2?Math.round((n-1)*100):-Math.round(100/(n-1)); };
const momioToDec = m => { const n=Number(m); if(!n) return 0; return n>0?(n/100)+1:(100/Math.abs(n))+1; };
// Promedio de momios americanos: se promedia en decimal y se regresa a americano (promediar +150 y -160 directo no tiene sentido)
const promedioMomio = lista => {
  const dec = lista.reduce((s,a)=>s+momioToDec(a.cuota),0)/lista.length;
  if(dec>=2) return Math.round((dec-1)*100);
  return -Math.round(100/(dec-1));
};
const parseFecha = f => { const [y,m,d]=f.split("-").map(Number); return {y,m:m-1,d}; };

const apMonto = (a, bank) => (Number(a.monto)||0) / 100 * ((typeof bank==="function"?bank(a):bank)||0);
const calcStats = (lista, bank) => {
  const gan = lista.filter(a=>a.resultado==="Ganada");
  const per = lista.filter(a=>a.resultado==="Perdida");
  const pen = lista.filter(a=>a.resultado==="Pendiente");
  const nul = lista.filter(a=>a.resultado==="Nula");
  const invertido = lista.reduce((s,a)=>s+apMonto(a,bank),0);
  const ganancia = gan.reduce((s,a)=>{ const m=apMonto(a,bank); return s+(m*momioToDec(a.cuota)-m); },0);
  const perdido = per.reduce((s,a)=>s+apMonto(a,bank),0);
  const neto = ganancia-perdido;
  const tot = gan.length+per.length;
  return {ganadas:gan.length,perdidas:per.length,pendientes:pen.length,nulas:nul.length,invertido,ganancia,perdido,neto,efectividad:tot>0?Math.round(gan.length/tot*100):0,total:lista.length};
};

function CalendarioMes({apuestas, todas, mes, ano, bank, onPrev, onNext, onHoy, renderAR}) {
  const vistas = todas||apuestas;
  const [sel, setSel] = useState(null);
  useEffect(()=>{ setSel(null); },[mes,ano]);

  const offset = (new Date(ano, mes, 1).getDay()+6)%7; // semana empieza en lunes
  const diasEnMes = new Date(ano, mes+1, 0).getDate();
  const delMes = (lista,dia) => lista.filter(a=>{ const {y,m,d}=parseFecha(a.fecha); return y===ano&&m===mes&&d===dia; });
  const gan = a => { const m=apMonto(a,bank); return a.resultado==="Ganada"?m*momioToDec(a.cuota)-m:a.resultado==="Perdida"?-m:0; };

  const netos = {};
  vistas.forEach(a=>{ const {y,m,d}=parseFecha(a.fecha); if(y===ano&&m===mes&&a.resultado!=="Pendiente") netos[d]=(netos[d]||0)+gan(a); });

  const totalG = apuestas.filter(a=>a.resultado==="Ganada").length;
  const totalP = apuestas.filter(a=>a.resultado==="Perdida").length;
  const profit = apuestas.reduce((s,a)=>s+gan(a),0);

  const fmtK = n => { const abs=Math.abs(n); const sg=n<0?"-":"+";
    if(abs>=1000) return sg+"$"+(abs/1000).toFixed(abs>=10000?0:1).replace(/\.0$/,"")+"K";
    return sg+"$"+Math.round(abs); };
  const hoy = new Date();
  const apsSel = sel ? delMes(vistas,sel) : [];
  const netoSel = sel ? delMes(apuestas,sel).reduce((s,a)=>s+gan(a),0) : 0;
  const diaNombre = sel ? ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date(ano,mes,sel).getDay()] : "";

  return html`<div>

      <button style=${S.sqBtn} onClick=${onNext} aria-label="Mes siguiente">›</button>
    </div>
    <div style=${{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:5,marginBottom:5}}>
      ${["L","M","M","J","V","S","D"].map((d,i)=>html`<div key=${i} style=${{textAlign:"center",fontSize:12,color:"#8f9bc4",fontWeight:700}}>${d}</div>`)}
    </div>
    <div style=${{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:5}}>
      ${Array(offset).fill(0).map((_,i)=>html`<div key=${"e"+i}/>`)}
      ${Array(diasEnMes).fill(0).map((_,i)=>{
        const dia=i+1;
        const lista=delMes(vistas,dia);
        const tiene=lista.length>0;
        const cuenta=delMes(apuestas,dia).length>0;
        const neto=netos[dia];
        const esHoy=hoy.getDate()===dia&&hoy.getMonth()===mes&&hoy.getFullYear()===ano;
        const col = neto===undefined ? null : neto>=0 ? "#2fe0a0" : "#ff5d7a";
        return html`<button key=${dia} onClick=${()=>tiene&&setSel(dia)}
          style=${{height:54,borderRadius:12,padding:"6px 0 0",fontFamily:"inherit",cursor:tiene?"pointer":"default",
            background:col?col+"24":"#121a38",border:sel===dia?"2px solid #4a8dff":esHoy?"2px solid #4a8dff88":"1px solid #243060",
            opacity:tiene&&!cuenta?.45:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:0}}>
          <span style=${{fontSize:14,fontWeight:esHoy?800:600,color:tiene||esHoy?"#fff":"#5a668f"}}>${dia}</span>
          ${col && html`<span style=${{fontSize:10,fontWeight:800,color:col,whiteSpace:"nowrap"}}>${fmtK(neto)}</span>`}
          ${tiene&&!col && html`<span style=${{fontSize:10}}>⏳</span>`}

      <span><span style=${{color:"#2fe0a0"}}>●</span> Ganó</span>

    ${sel && html`<div style=${{...S.overlay,alignItems:"flex-end",padding:0}} onClick=${()=>setSel(null)}>
      <div onClick=${e=>e.stopPropagation()} style=${{background:"#141d40",borderTop:"1px solid #2b3870",borderRadius:"26px 26px 0 0",width:"100%",maxWidth:640,maxHeight:"75vh",overflowY:"auto",padding:"10px 16px calc(20px + env(safe-area-inset-bottom))",boxShadow:"0 -10px 30px #0008"}}>

        ${apsSel.slice().reverse().map(a=>renderAR(a,false))}
        <div style=${{fontSize:12,color:"#8f9bc4",textAlign:"center",marginTop:4}}>${apsSel.length} ${apsSel.length===1?"pick":"picks"} este día</div>
        <button onClick=${()=>setSel(null)} style=${{...S.btnSecondary,width:"100%",marginTop:12,minHeight:46}}>Cerrar</button>
      </div>
    </div>`}
  </div>`;
}

// ── Imagen para compartir el resumen del mes ──
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function dibujarResumen(o){
  const hist = o.formato==="historia";
  const W=1080, H=hist?1920:1080, P=80;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d");
  const F=(w,s)=>`${w} ${s}px 'DM Sans','Helvetica Neue',Arial,sans-serif`;
  const G="#2fe0a0", R="#ff5d7a";
  let g;
  if(hist){ g=x.createRadialGradient(200,0,0,200,0,2000); g.addColorStop(0,"#1d4fd8"); g.addColorStop(.45,"#0f2160"); g.addColorStop(1,"#0a0f20"); }
  else { g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#1d4fd8"); g.addColorStop(1,"#0a0f20"); }
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.textBaseline="alphabetic"; x.textAlign="left";
  // Encabezado
  x.font=F(800,60); x.fillStyle="#fff"; x.fillText("ALEX",P,P+60);
  x.fillStyle="#9ec1ff"; x.fillText("PICKS",P+x.measureText("ALEX").width,P+60);
  x.font=F(600,34); const mw=x.measureText(o.mes).width+56;
  x.fillStyle="rgba(255,255,255,.14)"; rr(x,W-P-mw,P+8,mw,64,32); x.fill();
  x.fillStyle="#fff"; x.textAlign="center"; x.fillText(o.mes,W-P-mw/2,P+52); x.textAlign="left";
  // Resultado
  let y = hist?(o.mejor?560:640):300;
  x.font=F(600,36); x.fillStyle="rgba(255,255,255,.8)"; x.fillText("RESULTADO DEL MES",P,y);
  const pos = o.neto>=0;
  let grande, chico="";
  if(o.pct!==null){ grande=(o.pct>=0?"+":"-")+Math.abs(o.pct).toFixed(1)+"%"; if(o.pesos) chico=(pos?"+":"-")+fmt(Math.abs(o.neto)).replace("-","")+" MXN"; }
  else if(o.pesos){ grande=(pos?"+":"-")+fmt(Math.abs(o.neto)).replace("-",""); }
  else { grande=o.record; }
  const tg = hist?190:160;
  x.font=F(900,tg);
  while(x.measureText(grande).width>W-2*P && tg>60){ x.font=F(900,tg-=10); }
  y += tg*0.95; x.fillStyle=o.pct===null&&!o.pesos?"#fff":(pos?G:R); x.fillText(grande,P-6,y);
  if(chico){ y+=78; x.font=F(700,58); x.fillStyle="rgba(255,255,255,.92)"; x.fillText(chico,P,y); }
  // Tres datos
  y += hist?80:60;
  const bh = hist?170:150, gap=24, bw=(W-2*P-2*gap)/3;
  [[o.record,"Récord"],[o.acierto+"%","Acierto"],[o.racha,"Racha"]].forEach(([v,l],i)=>{
    const bx=P+i*(bw+gap);
    x.fillStyle="rgba(255,255,255,.1)"; rr(x,bx,y,bw,bh,34); x.fill();
    x.textAlign="center"; x.fillStyle="#fff"; x.font=F(800,hist?62:56); x.fillText(v,bx+bw/2,y+bh*0.52);
    x.font=F(500,30); x.fillStyle="rgba(255,255,255,.75)"; x.fillText(l,bx+bw/2,y+bh*0.82); x.textAlign="left";
  });
  y += bh;
  if(hist){
    // Últimos picks
    if(o.forma.length){
      y += 100; x.font=F(600,32); x.fillStyle="rgba(255,255,255,.75)"; x.fillText("ÚLTIMOS PICKS",P,y);
      y += 30; const d=78, sp=(W-2*P-10*d)/9;
      o.forma.forEach((r,i)=>{ const cx=P+i*(d+sp)+d/2, cy=y+d/2;
        x.beginPath(); x.arc(cx,cy,d/2,0,Math.PI*2); x.fillStyle=r==="Ganada"?G:R; x.fill();
        x.fillStyle="#06101f"; x.font=F(900,40); x.textAlign="center"; x.fillText(r==="Ganada"?"✓":"✕",cx,cy+14); x.textAlign="left"; });
      y += d;
    }
    // Mejor pick
    if(o.mejor){
      y += 70; const h=190;
      x.fillStyle="rgba(255,255,255,.09)"; rr(x,P,y,W-2*P,h,40); x.fill();
      x.font=F(600,30); x.fillStyle="rgba(255,255,255,.75)"; x.fillText("★ MEJOR PICK",P+40,y+62);
      x.font=F(800,46); x.fillStyle=G; x.textAlign="right"; x.fillText(o.mejor.valor,W-P-40,y+140);
      const maxW=W-2*P-80-x.measureText(o.mejor.valor).width-30; x.textAlign="left";
      x.font=F(700,46); x.fillStyle="#fff"; let t=o.mejor.texto;
      if(x.measureText(t).width>maxW){ while(t.length>1&&x.measureText(t+"…").width>maxW) t=t.slice(0,-1); t+="…"; }
      x.fillText(t,P+40,y+140);
    }
  }
  // Pie
  x.font=F(500,34); x.fillStyle="rgba(255,255,255,.7)";
  if(hist){ x.textAlign="center"; x.fillText("Sigue mis picks · AlexPicks",W/2,H-80); }
  else x.fillText("Sigue mis picks · AlexPicks",P,H-64);
  return c;
}

            <input style=${S.input} type="date" value=${form.fecha} onChange=${e=>setForm(f=>({...f,fecha:e.target.value}))}/>
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Resultado</label>
            <select style=${S.select} value=${form.resultado} onChange=${e=>setForm(f=>({...f,resultado:e.target.value}))}>
              ${RESULTADOS.map(r=>html`<option key=${r} value=${r}>${r}</option>`)}
            </select>
          </div>
        </div>
        ${form.monto&&form.cuota&&momioToDec(cuotaAm(form.cuota))>0 && html`<div style=${S.preview}>
          Momio: <span style=${{color:"#fff",fontWeight:700}}>${fmtMomio(cuotaAm(form.cuota))}</span>
          ${bankrollMes>0 && (()=>{ const st=(Number(form.monto)||0)/100*bankrollMes; return html`<span><span style=${{marginLeft:12}}>· Ganancia potencial: </span>
          <span style=${{color:"#2fe0a0",fontWeight:700}}>${fmt(st*momioToDec(cuotaAm(form.cuota))-st)}</span>
          <span style=${{color:"#8f9bc4",marginLeft:12}}>Retorno: ${fmt(st*momioToDec(cuotaAm(form.cuota)))}</span></span>`; })()}
        </div>`}
        ${formError && html`<div style=${{color:"#ff5d7a",fontSize:13,marginBottom:12,padding:"8px 12px",background:"#ff5d7a15",borderRadius:8,border:"1px solid #ff5d7a30"}}>⚠️ ${formError}</div>`}
        <div style=${S.modalFooter}>
          <button onClick=${()=>setModal(false)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${guardar} style=${S.btnPrimary}>Guardar</button>
        </div>
      </div>
    </div>`}

    <!-- Modal bank del usuario -->
    ${bankModal && html`<div style=${S.overlay} onClick=${()=>setBankModal(false)}>
      <div style=${{...S.modal,maxWidth:380}} onClick=${e=>e.stopPropagation()}>
        <div style=${S.modalHeader}>
          <h2 style=${S.modalTitle}>${isAdmin?"Bank":"Tu bank"} de ${MESES[mesSeleccionado].toLowerCase()}</h2>
          <button onClick=${()=>setBankModal(false)} style=${S.closeBtn}>✕</button>
        </div>
        <p style=${{color:"#8f9bc4",fontSize:13,marginBottom:14,lineHeight:1.4}}>${isAdmin?"Con cuánto empiezas el mes. Lo ven todos los que no han iniciado sesión.":"Escribe cuánto tienes y desde qué día cuentas los picks."}</p>
        <input style=${{...S.input,marginBottom:14}} type="number" inputMode="numeric" placeholder="Bank en MXN" value=${bmInput} onInput=${e=>setBmInput(e.target.value)}/>
        ${!isAdmin && [["dia1","Desde el día 1 del mes"],...(esMesActual?[["hoy","Desde hoy ("+fmtDia(hoyISO)+")"]]:[]),["otro","Elegir otro día"]].map(([v,l])=>html`
          <div key=${v} onClick=${()=>setBmModo(v)} style=${{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:10,marginBottom:8,cursor:"pointer",fontSize:14,border:"1px solid "+(bmModo===v?"#4a8dff":"#2b3870"),background:bmModo===v?"#4a8dff18":"transparent"}}>
            <span style=${{width:14,height:14,borderRadius:"50%",border:"2px solid "+(bmModo===v?"#4a8dff":"#556"),background:bmModo===v?"#4a8dff":"transparent",flexShrink:0}}></span>${l}
          </div>`)}
        ${bmModo==="otro" && html`<input style=${{...S.input,marginBottom:8}} type="date" min=${mesPrefijo+"-01"} max=${mesPrefijo+"-"+String(new Date(anoSeleccionado,mesSeleccionado+1,0).getDate()).padStart(2,"0")} value=${bmFecha} onChange=${e=>setBmFecha(e.target.value)}/>`}
        ${bmError && html`<div style=${{color:"#ff5d7a",fontSize:13,margin:"4px 0 8px"}}>⚠️ ${bmError}</div>`}
        <div style=${{...S.modalFooter,marginTop:12}}>
          <button onClick=${()=>setBankModal(false)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${guardarBankModal} style=${S.btnPrimary}>Guardar bank</button>
        </div>
      </div>
    </div>`}

    <!-- Modal eliminar -->
    ${deleteConfirm && html`<div style=${S.overlay} onClick=${()=>setDeleteConfirm(null)}>
      <div style=${{...S.modal,maxWidth:360}} onClick=${e=>e.stopPropagation()}>
        <div style=${S.modalHeader}>
          <h2 style=${{...S.modalTitle,color:"#ff5d7a"}}>Eliminar apuesta</h2>
          <button onClick=${()=>setDeleteConfirm(null)} style=${S.closeBtn}>✕</button>
        </div>
        <p style=${{color:"#aaa",marginBottom:24}}>¿Estás seguro? Esta acción no se puede deshacer.</p>
        <div style=${S.modalFooter}>
          <button onClick=${()=>setDeleteConfirm(null)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${()=>eliminar(deleteConfirm)} style=${{...S.btnPrimary,background:"#ff5d7a"}}>Eliminar</button>
        </div>
      </div>
    </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
