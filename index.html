  const provider = new firebase.auth.GoogleAuthProvider();

const fmt = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(n);
const fmtMomio = m => { const n=Number(m); if(!n) return ""; return n>0?`+${n}`:`${n}`; };
const momioToDec = m => { const n=Number(m); if(!n) return 0; return n>0?(n/100)+1:(100/Math.abs(n))+1; };
// Promedio de momios americanos: se promedia en decimal y se regresa a americano (promediar +150 y -160 directo no tiene sentido)
const promedioMomio = lista => {
  const dec = lista.reduce((s,a)=>s+momioToDec(a.cuota),0)/lista.length;
  if(dec>=2) return Math.round((dec-1)*100);
  return -Math.round(100/(dec-1));
};
const parseFecha = f => { const [y,m,d]=f.split("-").map(Number); return {y,m:m-1,d}; };

const apMonto = (a, bank) => (Number(a.monto)||0) / 100 * ((typeof bank==="function"?bank(a):bank)||0);
const calcStats = (lista, bank) => {
  const gan = lista.filter(a=>a.resultado==="Ganada");
  const per = lista.filter(a=>a.resultado==="Perdida");
  const pen = lista.filter(a=>a.resultado==="Pendiente");
  const nul = lista.filter(a=>a.resultado==="Nula");
  const invertido = lista.reduce((s,a)=>s+apMonto(a,bank),0);
  const ganancia = gan.reduce((s,a)=>{ const m=apMonto(a,bank); return s+(m*momioToDec(a.cuota)-m); },0);
  const perdido = per.reduce((s,a)=>s+apMonto(a,bank),0);
  const neto = ganancia-perdido;
  const tot = gan.length+per.length;
  return {ganadas:gan.length,perdidas:per.length,pendientes:pen.length,nulas:nul.length,invertido,ganancia,perdido,neto,efectividad:tot>0?Math.round(gan.length/tot*100):0,total:lista.length};
};

// ── Calendario mensual ──
function CalendarioMes({apuestas, todas, mes, ano, bank}) {
  const vistas = todas||apuestas;
  const [diaSeleccionado, setDiaSeleccionado] = useState(null);

  const primerDia = new Date(ano, mes, 1).getDay(); // 0=Dom
  const diasEnMes = new Date(ano, mes+1, 0).getDate();

  // Calcular neto por día
  const netosPorDia = {};
  vistas.forEach(a => {
    const {y,m,d} = parseFecha(a.fecha);
    if(m===mes && y===ano && a.resultado!=="Pendiente") {
      const m = apMonto(a,bank);
      const g = a.resultado==="Ganada" ? m*momioToDec(a.cuota)-m : a.resultado==="Perdida" ? -m : 0;
      netosPorDia[d] = (netosPorDia[d]||0) + g;
    }
  });

  // Apuestas del día seleccionado
  const apuestasDia = diaSeleccionado
    ? vistas.filter(a => { const {y,m,d}=parseFecha(a.fecha); return d===diaSeleccionado&&m===mes&&y===ano; })
    : [];

  const dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  // Total ganadas/perdidas del mes
  const totalG = apuestas.filter(a=>a.resultado==="Ganada").length;
  const totalP = apuestas.filter(a=>a.resultado==="Perdida").length;
  const totalPen = apuestas.filter(a=>a.resultado==="Pendiente").length;
  const profit = apuestas.filter(a=>a.resultado!=="Pendiente").reduce((s,a)=>{
    const m=apMonto(a,bank);
    return s + (a.resultado==="Ganada" ? m*momioToDec(a.cuota)-m : a.resultado==="Perdida" ? -m : 0);
  },0);

  const fmtK = n => {
    const abs = Math.abs(n);
    if(abs>=1000) return (n<0?"-":"+")+"\$"+(abs/1000).toFixed(abs%1000===0?0:1)+"K";
    return (n<0?"-":"+")+"\$"+Math.round(abs);
  };

  return html`<div style=${{marginBottom:32}}>
    <h2 style=${{fontSize:12,fontWeight:700,color:"#555",marginBottom:16,textTransform:"uppercase",letterSpacing:1.2}}>Calendario</h2>
    <div style=${{background:"#10131a",border:"1px solid #1e2130",borderRadius:16,padding:"20px 16px"}}>

      <!-- Header días semana -->
      <div style=${{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:4,marginBottom:8}}>
        ${dias.map(d=>html`<div key=${d} style=${{textAlign:"center",fontSize:11,color:"#555",fontWeight:600,padding:"4px 0"}}>${d}</div>`)}
      </div>

      <!-- Grid días -->
      <div style=${{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:4}}>
        <!-- Espacios vacíos al inicio -->
        ${Array(primerDia).fill(0).map((_,i)=>html`<div key=${"empty-"+i}/>`)}

        <!-- Días del mes -->
        ${Array(diasEnMes).fill(0).map((_,i)=>{
          const dia = i+1;
          const neto = netosPorDia[dia];
          const tieneApuestas = vistas.some(a=>{const {y,m,d}=parseFecha(a.fecha);return d===dia&&m===mes&&y===ano;});
          const isSelected = diaSeleccionado===dia;
          const isHoy = new Date().getDate()===dia && new Date().getMonth()===mes && new Date().getFullYear()===ano;

          let bg = "#13162a";
          let borderColor = isSelected?"#00e5a0":"#1e2130";
          if(neto!==undefined) {
            bg = neto>=0 ? (isSelected?"#00e5a030":"#00e5a015") : (isSelected?"#ff4e6a30":"#ff4e6a15");
            borderColor = neto>=0 ? "#00e5a040" : "#ff4e6a40";
          }

          return html`<div key=${dia}
            onClick=${()=>tieneApuestas?setDiaSeleccionado(isSelected?null:dia):null}
            style=${{
              background:bg,
              border:"1px solid "+borderColor,
              borderRadius:10,
              padding:"8px 4px",
              textAlign:"center",
              cursor:tieneApuestas?"pointer":"default",
              minHeight:56,
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,
              transition:"all .15s",
              opacity:(tieneApuestas&&!apuestas.some(a=>{const {y,m,d}=parseFecha(a.fecha);return d===dia&&m===mes&&y===ano;}))?.45:1
            }}>
            <div style=${{fontSize:12,color:isHoy?"#00e5a0":tieneApuestas?"#e8e8f0":"#444",fontWeight:isHoy?800:500}}>${dia}</div>
            ${neto!==undefined && html`<div style=${{fontSize:10,fontWeight:700,color:neto>=0?"#00e5a0":"#ff4e6a"}}>${fmtK(neto)}</div>`}
            ${tieneApuestas&&neto===undefined && html`<div style=${{fontSize:10,color:"#f5c842"}}>⏳</div>`}
          </div>`;
        })}
      </div>

      <!-- Record y profit -->
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,paddingTop:14,borderTop:"1px solid #1e2130",flexWrap:"wrap",gap:8}}>
        <div>
          <div style=${{fontSize:11,color:"#555",marginBottom:4,textTransform:"uppercase",letterSpacing:0.8}}>Record</div>
          <div style=${{fontSize:20,fontWeight:800,color:"#e8e8f0"}}>${totalG}-${totalP}${totalPen>0?"-"+totalPen:""}</div>
        </div>
        <div style=${{textAlign:"right"}}>
          <div style=${{fontSize:11,color:"#555",marginBottom:4,textTransform:"uppercase",letterSpacing:0.8}}>Profit</div>
          <div style=${{fontSize:20,fontWeight:800,color:profit>=0?"#00e5a0":"#ff4e6a"}}>${profit>=0?"+":""}${fmt(profit)}</div>
        </div>
      </div>

      <!-- Detalle día seleccionado -->
      ${diaSeleccionado && apuestasDia.length>0 && html`<div style=${{marginTop:14,paddingTop:14,borderTop:"1px solid #1e2130"}}>
        <div style=${{fontSize:12,color:"#00e5a0",fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:0.8}}>
          ${diaSeleccionado} de ${MESES[mes]}
        </div>
        ${apuestasDia.map(a=>{
          const g = a.resultado==="Ganada"?a.monto*momioToDec(a.cuota)-a.monto:a.resultado==="Perdida"?-a.monto:0;
          return html`<div key=${a.id} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #1e213040"}}>
            <div>
              <div style=${{fontSize:13,color:"#e8e8f0",fontWeight:600}}>${a.descripcion}</div>
              <div style=${{fontSize:11,color:"#555",marginTop:2}}>${a.deporte} · ${a.tipo} · Momio: ${fmtMomio(a.cuota)}</div>
            </div>
            <div style=${{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
              <div style=${{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:5,background:bgRes[a.resultado],color:colorRes[a.resultado]}}>${a.resultado}</div>
              <div style=${{fontSize:13,fontWeight:700,color:g>0?"#00e5a0":g<0?"#ff4e6a":"#aaa"}}>${g>0?"+":""}${fmt(g!==0?g:a.monto)}</div>
            </div>
          </div>`;
        })}
      </div>`}
    </div>
  </div>`;
}

// ── Main App ──
function App() {
  const [apuestas,setApuestas] = useState([]);
  const [cargando,setCargando] = useState(true);
  const [form,setForm] = useState(initialForm);
  const [editId,setEditId] = useState(null);

  const [mesSeleccionado,setMesSeleccionado] = useState(new Date().getMonth());
  const [anoSeleccionado,setAnoSeleccionado] = useState(new Date().getFullYear());
  const [deleteConfirm,setDeleteConfirm] = useState(null);
  const [deporteFiltro,setDeporteFiltro] = useState(null);
  const [user,setUser] = useState(null);
  const [bankrolls,setBankrolls] = useState({});
  const [bankrollsUser,setBankrollsUser] = useState({});
  const [iniciosUser,setIniciosUser] = useState({});
  const [bankModal,setBankModal] = useState(false);
  const [bmInput,setBmInput] = useState("");
  const [bmModo,setBmModo] = useState("dia1");
  const [bmFecha,setBmFecha] = useState("");
  const [bmError,setBmError] = useState("");
  const [editingBank,setEditingBank] = useState(false);
  const [bankInput,setBankInput] = useState("");
  const [formError,setFormError] = useState("");

  useEffect(()=>{
    const unsub = db.collection("apuestas").orderBy("fecha","asc").onSnapshot(snap=>{
      setApuestas(snap.docs.map(d=>({...d.data(),_docId:d.id})));
      setCargando(false);
    },()=>setCargando(false));
    return ()=>unsub();
  },[]);

  useEffect(()=>{
    return auth.onAuthStateChanged(u=>setUser(u));
  },[]);

  const isAdmin = !!user && ADMIN_EMAILS.includes((user.email||"").toLowerCase());
  const modoEdicion = isAdmin;
  const usaBankPropio = !!user && !isAdmin;

  // Bank del admin (el de siempre) — lo ven también los que no han iniciado sesión
  useEffect(()=>{
    const unsub = db.collection("config").doc("bankrolls").onSnapshot(snap=>{
      if(snap.exists) setBankrolls(snap.data());
    });
    return ()=>unsub();
  },[]);

  // Bank personal de cada usuario
  useEffect(()=>{
    if(!usaBankPropio){ setBankrollsUser({}); setIniciosUser({}); return; }
    const unsub = db.collection("usuarios").doc(user.uid).onSnapshot(snap=>{
      setBankrollsUser(snap.exists?(snap.data().bankrolls||{}):{});
      setIniciosUser(snap.exists?(snap.data().inicios||{}):{});
    });
    return ()=>unsub();
  },[usaBankPropio,user&&user.uid]);

  const bankKey = `${anoSeleccionado}-${mesSeleccionado}`;
  const bankrollMes = (usaBankPropio?bankrollsUser:bankrolls)[bankKey]||0;
  const setBankroll = val => {
    if(isAdmin){
      const updated = {...bankrolls,[bankKey]:Number(val)||0};
      db.collection("config").doc("bankrolls").set(updated);
    } else if(usaBankPropio){
      const updated = {...bankrollsUser,[bankKey]:Number(val)||0};
      db.collection("usuarios").doc(user.uid).set({bankrolls:updated,email:user.email||"",nombre:user.displayName||""},{merge:true});
    }
  };
  const puedeEditarBank = !!user;

  // Bank y día de inicio por apuesta (cada mes es independiente)
  const bankReal = a => { const {y,m}=parseFecha(a.fecha); return (usaBankPropio?bankrollsUser:bankrolls)[`${y}-${m}`]||0; };
  // Estimado para meses sin bank (solo amigos): el bank registrado del mes más cercano
  const bankEstimado = (y,m) => {
    if(!usaBankPropio) return 0;
    const ks = Object.keys(bankrollsUser).filter(k=>bankrollsUser[k]>0).map(k=>{const [yy,mm]=k.split("-").map(Number);return {k,idx:yy*12+mm};});
    if(!ks.length) return 0;
    const t=y*12+m; ks.sort((a,b)=>Math.abs(a.idx-t)-Math.abs(b.idx-t)||b.idx-a.idx);
    return bankrollsUser[ks[0].k];
  };
  const bankDe = a => { const r=bankReal(a); if(r>0||!usaBankPropio) return r; const {y,m}=parseFecha(a.fecha); return bankEstimado(y,m); };
  const inicioDe = a => { if(!usaBankPropio) return ""; const {y,m}=parseFecha(a.fecha); return iniciosUser[`${y}-${m}`]||""; };
  // Una apuesta cuenta si el usuario no tiene bank ese mes (solo se ve) o si es del día de inicio en adelante
  const cuentaAp = a => { if(!usaBankPropio) return true; if(!(bankReal(a)>0)) return true; const ini=inicioDe(a); return !ini || a.fecha>=ini; };
  const cuentaAnual = a => !usaBankPropio || (bankReal(a)>0 && cuentaAp(a));
  const fmtDia = iso => { const {m,d}=parseFecha(iso); return d+" "+MESES_CORTO[m].toLowerCase(); };
  const hoyISO = new Date().toLocaleDateString("en-CA");
  const esMesActual = mesSeleccionado===new Date().getMonth() && anoSeleccionado===new Date().getFullYear();
  const mesPrefijo = `${anoSeleccionado}-${String(mesSeleccionado+1).padStart(2,"0")}`;
  const abrirBankModal = () => {
    const ini = iniciosUser[bankKey]||"";
    setBmInput(bankrollMes?String(bankrollMes):"");
    if(!ini){ setBmModo("dia1"); setBmFecha(""); }
    else if(ini===hoyISO && esMesActual){ setBmModo("hoy"); setBmFecha(ini); }
    else { setBmModo("otro"); setBmFecha(ini); }
    setBmError("");
    setBankModal(true);
  };
  const guardarBankModal = () => {
    const val = Number(bmInput)||0;
    if(!(val>0)) { setBmError("Escribe tu bank (mayor a 0)"); return; }
    let ini = "";
    if(bmModo==="hoy") ini = hoyISO;
    if(bmModo==="otro") { if(!bmFecha){ setBmError("Elige el día de inicio"); return; } ini = bmFecha; }
    if(ini){ const {y,m}=parseFecha(ini); if(y!==anoSeleccionado||m!==mesSeleccionado){ setBmError("Elige un día de "+MESES[mesSeleccionado]); return; } }
    const b2 = {...bankrollsUser,[bankKey]:val};
    const i2 = {...iniciosUser}; if(ini) i2[bankKey]=ini; else delete i2[bankKey];
    db.collection("usuarios").doc(user.uid).set(
      {bankrolls:b2,inicios:i2,email:user.email||"",nombre:user.displayName||""},
      {mergeFields:["bankrolls","inicios","email","nombre"]});
    setBankModal(false);
  };

  const apuestasMesTodas = useMemo(()=>apuestas.filter(a=>{
    const {y,m}=parseFecha(a.fecha); return m===mesSeleccionado&&y===anoSeleccionado;
  }),[apuestas,mesSeleccionado,anoSeleccionado]);
  const dep = [usaBankPropio,bankrollsUser,iniciosUser,bankrolls];
  const apuestasMes = useMemo(()=>apuestasMesTodas.filter(cuentaAp),[apuestasMesTodas,...dep]);
  const apuestasAntes = useMemo(()=>apuestasMesTodas.filter(a=>!cuentaAp(a)),[apuestasMesTodas,...dep]);

  const apuestasAno = useMemo(()=>apuestas.filter(a=>parseFecha(a.fecha).y===anoSeleccionado).filter(cuentaAnual),[apuestas,anoSeleccionado,...dep]);
  const stats = useMemo(()=>calcStats(apuestasMes,bankDe),[apuestasMes,...dep]);
  const simNeto = (usaBankPropio&&bankrollMes>0&&apuestasAntes.length>0) ? calcStats(apuestasMesTodas,bankDe).neto : null;

  const momioPromedioMes = useMemo(()=>{
    const con = apuestasMes.filter(a=>a.cuota&&a.cuota!==0);
    if(!con.length) return null;
    return promedioMomio(con);
  },[apuestasMes]);

  const rachaActual = useMemo(()=>{
    const finalizadas = apuestasMes.filter(a=>a.resultado!=="Pendiente").sort((a,b)=>a.fecha.localeCompare(b.fecha));
    if(finalizadas.length===0) return {racha:0,tipo:null};
    let racha=1, tipo=finalizadas[finalizadas.length-1].resultado;
    for(let i=finalizadas.length-2;i>=0;i--){
      if(finalizadas[i].resultado===tipo) racha++;
      else break;
    }
    return {racha,tipo};
  },[apuestasMes]);
  const statsAnual = useMemo(()=>calcStats(apuestasAno,bankDe),[apuestasAno,...dep]);

  const momioPromedio = useMemo(()=>{
    const finalizadas = apuestasAno.filter(a=>a.cuota&&a.cuota!==0);
    if(!finalizadas.length) return null;
    return promedioMomio(finalizadas);
  },[apuestasAno]);

  const datosPorMes = useMemo(()=>MESES_CORTO.map((mes,i)=>{
    const lista=apuestas.filter(a=>{const {y,m}=parseFecha(a.fecha);return m===i&&y===anoSeleccionado;}).filter(cuentaAnual);
    return {mes,...calcStats(lista,bankDe)};
  }),[apuestas,anoSeleccionado,...dep]);

  const porDeporteMes = useMemo(()=>DEPORTES.map(d=>{
    const ap=apuestasMes.filter(a=>a.deporte===d);
    return {deporte:d,total:ap.length,ganadas:ap.filter(a=>a.resultado==="Ganada").length,perdidas:ap.filter(a=>a.resultado==="Perdida").length};
  }).filter(d=>d.total>0),[apuestasMes]);

  const porDeporteAno = useMemo(()=>DEPORTES.map(d=>{
    const ap=apuestasAno.filter(a=>a.deporte===d);
    const gan=ap.filter(a=>a.resultado==="Ganada");
    const per=ap.filter(a=>a.resultado==="Perdida");
    const ganancia=gan.reduce((s,a)=>{ const m=apMonto(a,bankDe); return s+(m*momioToDec(a.cuota)-m); },0);
    const perdido=per.reduce((s,a)=>s+apMonto(a,bankDe),0);
    return {deporte:d,total:ap.length,ganadas:gan.length,perdidas:per.length,neto:ganancia-perdido};
  }).filter(d=>d.total>0),[apuestasAno,...dep]);

  const maxNeto = useMemo(()=>Math.max(...datosPorMes.map(d=>Math.abs(d.neto)),1),[datosPorMes]);

  const gananciaAp = a => { const m=apMonto(a,bankDe); return a.resultado==="Ganada"?m*momioToDec(a.cuota)-m:a.resultado==="Perdida"?-m:0; };

  const renderAR = (a,exp) => html`<${AR} key=${a.id} a=${a} onEdit=${()=>openModal(a)} onDelete=${()=>setDeleteConfirm(a.id)} onToggle=${r=>cambiarResultado(a.id,r)} g=${gananciaAp(a)} monto=${apMonto(a,bankDe)} expanded=${exp} editable=${modoEdicion}/>`;
  const subtitulo = {fontSize:11,letterSpacing:1,color:"#666",fontWeight:700,margin:"16px 2px 10px",textTransform:"uppercase"};
  const renderLista = exp => html`
    ${apuestasAntes.length>0 && apuestasMes.length>0 && html`<div style=${subtitulo}>Desde que empezaste</div>`}
    ${apuestasMes.slice().reverse().map(a=>renderAR(a,exp))}
    ${apuestasAntes.length>0 && html`<div>
      <div style=${subtitulo}>Antes de empezar <span style=${{background:"#2a2e42",color:"#aab",borderRadius:6,padding:"2px 6px",fontSize:9,marginLeft:6}}>NO SUMA</span></div>
      <div style=${{opacity:.45}}>${apuestasAntes.slice().reverse().map(a=>renderAR(a,exp))}</div>
    </div>`}`;

  const openModal = (ap=null) => {
    if(ap){
      const patas=ap.patas?ap.patas.map(p=>typeof p==="string"?{deporte:"",desc:p}:p):[{deporte:"",desc:""},{deporte:"",desc:""}];
      setForm({...ap,monto:String(ap.monto),cuota:String(ap.cuota),patas});
      setEditId(ap.id);
    } else {setForm(initialForm);setEditId(null);}
    setFormError("");
    setModal(true);
  };

  const guardar = () => {
    const esParlay = form.tipo==="Parlay/Combinada";
    const esFreebet = form.tipo==="Freebet";
    const usaPatas = esParlay||esFreebet;
    const deporteOpcional = usaPatas||form.tipo==="Especial por jugador"||form.tipo==="PlayBoost";
    const desc = usaPatas
      ? form.patas.filter(p=>p.desc && p.desc.trim()).map(p=>(p.deporte?`[${p.deporte}] `:"")+p.desc).join(" | ")
      : form.descripcion;
    const deporteOk = deporteOpcional||!!form.deporte;
    const cuotaVal = String(form.cuota).trim();
    const cuotaOk = cuotaVal!==""&&cuotaVal!=="0"&&!isNaN(Number(cuotaVal));
    const montoOk = String(form.monto).trim()!==""&&Number(form.monto)>0;
    const descOk = desc && desc.trim().length>0;
    if(!form.tipo) { setFormError("Selecciona el tipo de apuesta"); return; }
    if(!deporteOk) { setFormError("Selecciona el deporte"); return; }
    if(!descOk) { setFormError("Agrega una descripción"); return; }
    if(!montoOk) { setFormError("Agrega un monto mayor a 0"); return; }
    if(!cuotaOk) { setFormError("Agrega un momio válido (ej: -110 o +150)"); return; }
    if(!form.fecha) { setFormError("Selecciona la fecha"); return; }
    setFormError("");
    const deporte = !form.deporte ? (usaPatas?"Combinación":form.tipo) : form.deporte;
    const nueva = {deporte,descripcion:desc,monto:Number(form.monto),cuota:Number(form.cuota),resultado:form.resultado,fecha:form.fecha,tipo:form.tipo,patas:form.patas||[]};
    if(editId){
      const docId=apuestas.find(a=>a.id===editId)?._docId;
      if(docId) db.collection("apuestas").doc(docId).set({...nueva,id:editId});
      else db.collection("apuestas").add({...nueva,id:editId});
    } else {
      db.collection("apuestas").add({...nueva,id:Date.now()});
      // Notificar a todos
      const momioStr = Number(nueva.cuota)>0?"+"+nueva.cuota:String(nueva.cuota);
      enviarNotificacion(
        "🎯 Nuevo pick — AlexPicks",
        nueva.descripcion+" | "+nueva.deporte+" | Momio: "+momioStr+" | "+nueva.monto+"u = "+fmt(apMonto(nueva,bankrollMes))
      );
    }
    setModal(false);
  };

  const eliminar = id => {
    const docId=apuestas.find(a=>a.id===id)?._docId;
    if(docId) db.collection("apuestas").doc(docId).delete();
    setDeleteConfirm(null);
  };

  const cambiarResultado = (id,resultado) => {
    const ap=apuestas.find(a=>a.id===id);
    if(!ap?._docId) return;
    db.collection("apuestas").doc(ap._docId).update({resultado});
    if(resultado==="Ganada"||resultado==="Perdida"||resultado==="Nula") {
      const emoji = resultado==="Ganada"?"✅":resultado==="Nula"?"🔄":"❌";
      const m = apMonto(ap,bankrollMes);
      const ganancia = resultado==="Ganada"
        ? Math.round(m*momioToDec(ap.cuota)-m)
        : -m;
      const ganStr = resultado==="Ganada"?"+$"+ganancia:resultado==="Nula"?"$0 (Nula)":"-$"+Math.abs(ganancia);
      enviarNotificacion(
        emoji+" "+resultado.toUpperCase()+" — AlexPicks",
        ap.descripcion+" | "+ap.deporte+" | "+ganStr
      );
    }
  };

  const prevMes = () => { if(mesSeleccionado===0){setMesSeleccionado(11);setAnoSeleccionado(y=>y-1);}else setMesSeleccionado(m=>m-1); };
  const nextMes = () => { if(mesSeleccionado===11){setMesSeleccionado(0);setAnoSeleccionado(y=>y+1);}else setMesSeleccionado(m=>m+1); };

  if(cargando) return html`<div style=${{minHeight:"100vh",background:"#0d0f14",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
    <div style=${{fontSize:40,color:"#00e5a0"}}>◈</div>

  return html`<div style=${S.root}>
    <div style=${S.glow1}/><div style=${S.glow2}/>

    <!-- Header -->
    <header style=${S.header}>
      <div style=${S.logo}>
        <span style=${S.logoIcon}>◈</span>
        <div>
          <div style=${S.logoTitle}>Registro de Apuestas</div>

        ${[["dashboard","Dashboard"],["apuestas","Mis Apuestas"]].map(([v,l])=>html`

      </nav>
      <div style=${{display:"flex",gap:8,alignItems:"center"}}>
        ${!user
          ? html`<button onClick=${loginGoogle} style=${{...S.btnSecondary,fontSize:13,display:"flex",alignItems:"center",gap:6}}>
              <span style=${{fontWeight:800,color:"#4285f4"}}>G</span> Entrar con Google</button>`
          : html`<div style=${{display:"flex",alignItems:"center",gap:8}}>

                ? html`<img src=${user.photoURL} referrerPolicy="no-referrer" style=${{width:28,height:28,borderRadius:"50%",border:isAdmin?"2px solid #00e5a0":"1px solid #2a2e42"}} title=${user.email}/>`

          <div style=${{...S.card,borderColor:rachaActual.tipo==="Ganada"?"#00e5a040":rachaActual.tipo==="Perdida"?"#ff4e6a40":"#1e2130"}}>

        </div>
        <${CalendarioMes} apuestas=${apuestasMes} todas=${apuestasMesTodas} mes=${mesSeleccionado} ano=${anoSeleccionado} bank=${bankDe}/>
        ${porDeporteMes.length>0 && html`<${DeportesGrid} data=${porDeporteMes} onSelect=${d=>setDeporteFiltro(p=>p===d?null:d)} selected=${deporteFiltro}/>`}

          </div>
          ${apuestasMes.filter(a=>a.deporte===deporteFiltro).length===0
            ? html`<div style=${S.empty}>No hay apuestas de este deporte este mes.</div>`
            : [...apuestasMes].reverse().filter(a=>a.deporte===deporteFiltro).map(a=>html`<${AR} key=${a.id} a=${a} onEdit=${()=>openModal(a)} onDelete=${()=>setDeleteConfirm(a.id)} onToggle=${r=>cambiarResultado(a.id,r)} g=${gananciaAp(a)} monto=${apMonto(a,bankDe)} expanded editable=${modoEdicion}/>`)
          }
        </div>`}
        <div style=${S.section}>
          <h2 style=${S.secTitle}>Apuestas del mes</h2>
          ${apuestasMesTodas.length===0
            ? html`<div style=${S.empty}>No hay apuestas este mes.<br/>¡Agrega tu primera!</div>`
            : renderLista(false)
          }
        </div>

      <!-- MENSUAL APUESTAS -->
      ${periodoVista==="mensual" && vistaActual==="apuestas" && html`<div style=${S.section}>
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h2 style=${{...S.secTitle,marginBottom:0}}>Apuestas — ${MESES[mesSeleccionado]}</h2>
          <span style=${S.badge}>${apuestasMes.length}</span>
        </div>
        ${apuestasMesTodas.length===0
          ? html`<div style=${S.empty}>No hay apuestas este mes.</div>`
          : renderLista(true)

      <!-- ANUAL DASHBOARD -->
      ${periodoVista==="anual" && vistaActual==="dashboard" && html`<div>
        <div style=${S.statsGrid}>

          <${SC} label="Efectividad" value=${statsAnual.efectividad+"%"} sub=${statsAnual.ganadas+"G · "+statsAnual.perdidas+"P"+(statsAnual.nulas>0?" · "+statsAnual.nulas+"N":"")} vc=${statsAnual.efectividad>=50?"#00e5a0":"#ff4e6a"}/>

                      : html`<div style=${{width:"100%",height:"2px",background:"#1e2130",borderRadius:2}}/>`

                  <div style=${{fontSize:9,color:i===mesSeleccionado?"#e8e8f0":"#555",fontWeight:i===mesSeleccionado?700:400,marginTop:4}}>${d.mes}</div>

                <div style=${{display:"flex",flexDirection:"column",gap:10}}>
                  ${form.patas.map((p,i)=>html`
                    <div key=${i} style=${{background:"#0d0f14",border:"1px solid #1e2130",borderRadius:10,padding:"10px 12px"}}>
                      <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                        <span style=${{fontSize:12,color:"#00e5a0",fontWeight:700}}>Leg ${i+1}</span>
                        <button onClick=${()=>setForm(f=>({...f,patas:f.patas.filter((_,j)=>j!==i)}))} style=${S.removePataBtn}>✕ Eliminar</button>
                      </div>
                      <div style=${{display:"flex",gap:8,flexDirection:"column"}}>
                        <select style=${S.select} value=${p.deporte} onChange=${e=>setForm(f=>{const np=[...f.patas];np[i]={...np[i],deporte:e.target.value};return{...f,patas:np};})}>
                          <option value="">Deporte (opcional)</option>
                          ${DEPORTES.map(d=>html`<option key=${d} value=${d}>${iconDeporte[d]} ${d}</option>`)}
                        </select>
                        <input style=${S.input} value=${p.desc} onInput=${e=>setForm(f=>{const np=[...f.patas];np[i]={...np[i],desc:e.target.value};return{...f,patas:np};})} placeholder=${"Descripción: Ej: Lakers -5.5"}/>
                      </div>
                    </div>
                  `)}
                </div>
              </div>`
          }
          <div style=${S.fg}>
            <label style=${S.label}>Porcentaje del bank (%)</label>
            <input style=${S.input} type="number" value=${form.monto} onInput=${e=>setForm(f=>({...f,monto:e.target.value}))} placeholder="2" min="0" step="0.5"/>
            ${bankrollMes>0 && html`<div style=${{fontSize:11,color:"#00e5a0",marginTop:4}}>= ${fmt((Number(form.monto)||0)/100*bankrollMes)} MXN</div>`}
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Momio (americano)</label>
            <div style=${{display:"flex",gap:8}}>
              <button type="button" onClick=${()=>setForm(f=>{const d=String(f.cuota).replace(/[^0-9]/g,"");const neg=String(f.cuota).trim().startsWith("-");return{...f,cuota:(neg?"+":"-")+d};})}
                style=${{...S.btnSecondary,padding:"0 16px",fontSize:20,fontWeight:800,flexShrink:0,color:String(form.cuota).trim().startsWith("-")?"#ff4e6a":"#00e5a0"}}>${String(form.cuota).trim().startsWith("-")?"−":"+"}</button>
              <input style=${{...S.input,flex:1,minWidth:0}} type="text" inputMode="numeric" value=${form.cuota} onInput=${e=>setForm(f=>({...f,cuota:e.target.value}))} onBlur=${e=>{const v=e.target.value.trim();if(v&&!v.startsWith("-")&&!v.startsWith("+"))setForm(f=>({...f,cuota:"+"+v}));}} placeholder="-110 o +150"/>
            </div>
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Fecha</label>
            <input style=${S.input} type="date" value=${form.fecha} onChange=${e=>setForm(f=>({...f,fecha:e.target.value}))}/>
          </div>
          <div style=${S.fg}>
            <label style=${S.label}>Resultado</label>
            <select style=${S.select} value=${form.resultado} onChange=${e=>setForm(f=>({...f,resultado:e.target.value}))}>
              ${RESULTADOS.map(r=>html`<option key=${r} value=${r}>${r}</option>`)}
            </select>
          </div>
        </div>
        ${form.monto&&form.cuota&&momioToDec(form.cuota)>0 && html`<div style=${S.preview}>
          Momio: <span style=${{color:"#fff",fontWeight:700}}>${fmtMomio(form.cuota)}</span>
          <span style=${{marginLeft:12}}>· Ganancia potencial: </span>
          <span style=${{color:"#00e5a0",fontWeight:700}}>${fmt(form.monto*momioToDec(form.cuota)-form.monto)}</span>
          <span style=${{color:"#666",marginLeft:12}}>Retorno: ${fmt(form.monto*momioToDec(form.cuota))}</span>
        </div>`}
        ${formError && html`<div style=${{color:"#ff4e6a",fontSize:13,marginBottom:12,padding:"8px 12px",background:"#ff4e6a15",borderRadius:8,border:"1px solid #ff4e6a30"}}>⚠️ ${formError}</div>`}
        <div style=${S.modalFooter}>
          <button onClick=${()=>setModal(false)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${guardar} style=${S.btnPrimary}>Guardar</button>
        </div>
      </div>
    </div>`}

    <!-- Modal bank del usuario -->
    ${bankModal && html`<div style=${S.overlay} onClick=${()=>setBankModal(false)}>
      <div style=${{...S.modal,maxWidth:380}} onClick=${e=>e.stopPropagation()}>
        <div style=${S.modalHeader}>
          <h2 style=${S.modalTitle}>Tu bank de ${MESES[mesSeleccionado].toLowerCase()}</h2>
          <button onClick=${()=>setBankModal(false)} style=${S.closeBtn}>✕</button>
        </div>
        <p style=${{color:"#888",fontSize:13,marginBottom:14,lineHeight:1.4}}>Escribe cuánto tienes y desde qué día cuentas los picks.</p>
        <input style=${{...S.input,marginBottom:14}} type="number" inputMode="numeric" placeholder="Bank en MXN" value=${bmInput} onInput=${e=>setBmInput(e.target.value)}/>
        ${[["dia1","Desde el día 1 del mes"],...(esMesActual?[["hoy","Desde hoy ("+fmtDia(hoyISO)+")"]]:[]),["otro","Elegir otro día"]].map(([v,l])=>html`
          <div key=${v} onClick=${()=>setBmModo(v)} style=${{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:10,marginBottom:8,cursor:"pointer",fontSize:14,border:"1px solid "+(bmModo===v?"#00e5a0":"#2a2e42"),background:bmModo===v?"#00e5a010":"transparent"}}>
            <span style=${{width:14,height:14,borderRadius:"50%",border:"2px solid "+(bmModo===v?"#00e5a0":"#556"),background:bmModo===v?"#00e5a0":"transparent",flexShrink:0}}></span>${l}
          </div>`)}
        ${bmModo==="otro" && html`<input style=${{...S.input,marginBottom:8}} type="date" min=${mesPrefijo+"-01"} max=${mesPrefijo+"-"+String(new Date(anoSeleccionado,mesSeleccionado+1,0).getDate()).padStart(2,"0")} value=${bmFecha} onChange=${e=>setBmFecha(e.target.value)}/>`}
        ${bmError && html`<div style=${{color:"#ff4e6a",fontSize:13,margin:"4px 0 8px"}}>⚠️ ${bmError}</div>`}
        <div style=${{...S.modalFooter,marginTop:12}}>
          <button onClick=${()=>setBankModal(false)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${guardarBankModal} style=${S.btnPrimary}>Guardar bank</button>
        </div>
      </div>
    </div>`}

    <!-- Modal eliminar -->
    ${deleteConfirm && html`<div style=${S.overlay} onClick=${()=>setDeleteConfirm(null)}>
      <div style=${{...S.modal,maxWidth:360}} onClick=${e=>e.stopPropagation()}>
        <div style=${S.modalHeader}>
          <h2 style=${{...S.modalTitle,color:"#ff4e6a"}}>Eliminar apuesta</h2>
          <button onClick=${()=>setDeleteConfirm(null)} style=${S.closeBtn}>✕</button>
        </div>
        <p style=${{color:"#aaa",marginBottom:24}}>¿Estás seguro? Esta acción no se puede deshacer.</p>
        <div style=${S.modalFooter}>
          <button onClick=${()=>setDeleteConfirm(null)} style=${S.btnSecondary}>Cancelar</button>
          <button onClick=${()=>eliminar(deleteConfirm)} style=${{...S.btnPrimary,background:"#ff4e6a"}}>Eliminar</button>
        </div>
      </div>
    </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
